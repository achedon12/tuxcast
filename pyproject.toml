[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tuxcast"
dynamic = ["version"]
description = "The toolkit for streaming on Linux: diagnose your setup, convert Elgato Stream Deck profiles, bridge sandboxed apps and split your audio."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "achedon12" }]
keywords = ["linux", "streaming", "obs", "stream-deck", "streamcontroller", "twitch", "pipewire", "discord", "flatpak"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Utilities",
]
# No runtime dependencies on purpose: tuxcast must install anywhere with pipx in seconds.
dependencies = []

[project.urls]
Homepage = "https://achedon12.github.io/tuxcast/"
Documentation = "https://achedon12.github.io/tuxcast/"
Repository = "https://github.com/achedon12/tuxcast"
Issues = "https://github.com/achedon12/tuxcast/issues"
Changelog = "https://github.com/achedon12/tuxcast/blob/main/CHANGELOG.md"

[project.scripts]
tuxcast = "tuxcast.cli:main"

[tool.hatch.version]
path = "src/tuxcast/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "contrib", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLW0603",
    "PLC0415",  # lazy imports keep `tuxcast --help` fast and register doctor checks on demand
    "RUF001",   # the CLI prints symbols such as ✔ on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLC0415"]
".github/scripts/render-terminal.py" = ["E501"]  # the SVG template reads best unwrapped
