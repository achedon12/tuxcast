name: Docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'overrides/**', 'mkdocs.yml', 'src/tuxcast/dashboard/static/**', '.github/demo/**', '.github/workflows/docs.yml', '.github/scripts/build-wiki.py', '.github/scripts/build-demo.py']
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  site:
    name: Build the website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # "last updated" dates come from git history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install "mkdocs<2" mkdocs-material mkdocs-git-revision-date-localized-plugin   # MkDocs 2 drops the plugin system Material needs
      - name: Build the dashboard demo
        run: python3 .github/scripts/build-demo.py
      - run: mkdocs build --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  wiki:
    name: Sync the wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check out the wiki
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
      - name: Generate the wiki from docs/
        run: python3 .github/scripts/build-wiki.py . wiki
      - name: Publish
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
          else
            git commit -m "Sync from docs at ${GITHUB_SHA::7}"
            git push
          fi
