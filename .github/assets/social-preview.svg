    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" rx="0" fill="url(#page)"/>
  <rect width="1280" height="640" rx="0" fill="url(#glow)"/>
  <svg x="550" y="90" width="180" height="180" viewBox="0 0 128 128">
  <defs>
